<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Kids Games</title>
<meta name="description" content="A family collection of kids games — pick one and play.">
<meta name="theme-color" content="#fdf6e6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf6e6;
    --bg-pattern: #f7ecd6;
    --ink: #2b1d16;
    --ink-soft: #6b5647;
    --card: #fffaf0;
    --card-border: #eddcbd;
    --shadow: 0 6px 0 rgba(43,29,22,0.12), 0 10px 24px rgba(43,29,22,0.10);
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 10% 10%, #fff 0%, transparent 40%),
      repeating-linear-gradient(135deg, var(--bg) 0px, var(--bg) 26px, var(--bg-pattern) 26px, var(--bg-pattern) 52px);
    color: var(--ink);
    font-family: 'Nunito', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, .display { font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif; }
  a { text-decoration: none; color: inherit; }

  #app {
    max-width: 720px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
  }

  header { text-align: center; margin-bottom: 28px; }
  header .emoji { font-size: 2.6rem; }
  h1 {
    font-weight: 800;
    font-size: 1.6rem;
    margin: 6px 0 4px;
  }
  header p {
    margin: 0;
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 0.9rem;
  }

  .game-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 520px) {
    .game-grid { grid-template-columns: 1fr 1fr; }
  }

  .game-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
    background: var(--card);
    border: 2px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 18px;
    transition: transform 0.12s ease;
  }
  .game-card:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(43,29,22,0.12); }
  .game-card .icon {
    font-size: 3rem;
    line-height: 1;
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    margin-bottom: 4px;
  }
  .game-card .name {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 1.15rem;
  }
  .game-card .desc {
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 0.85rem;
    line-height: 1.35;
  }
  .game-card.alebrijes .icon { background: #ffe1ec; }
  .game-card.dino .icon { background: #e0f2e4; }

  footer {
    margin-top: auto;
    padding-top: 30px;
    text-align: center;
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 0.75rem;
    opacity: 0.75;
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="emoji">🎮</div>
    <h1>Kids Games</h1>
    <p>Pick a game to play</p>
  </header>

  <div class="game-grid">
    <a class="game-card alebrijes" href="alebrijes-garden/index.html">
      <span class="icon">🌵</span>
      <span class="name">Alebrijes Garden</span>
      <span class="desc">Plant seeds, grow spirit creatures, and discover them together.</span>
    </a>

    <a class="game-card dino" href="dino-diet/index.html">
      <span class="icon">🦖</span>
      <span class="name">Dino Diet</span>
      <span class="desc">Feed each dinosaur the food it really eats and watch it grow up!</span>
    </a>
  </div>

  <footer>More games coming soon 🌟</footer>
</div>

</body>
</html>
</content>
